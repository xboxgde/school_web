<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>생일 축하해요 🎂</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 오른쪽 상단 고정 개발자 버튼 -->
  <button id="admin-btn" class="admin-btn" type="button">개발자</button>

  <!-- 화면 1: 환영 화면 -->
  <section id="screen-welcome" class="screen screen--center">
    <button id="welcome-btn" class="big-btn" type="button">환영합니다!</button>
  </section>

  <!-- 화면 2: 생일 입력 화면 -->
  <section id="screen-input" class="screen screen--center" hidden>
    <form id="birthday-form" class="panel">
      <h2>생일을 입력해 주세요</h2>
      <div class="row">
        <select id="bd-month" aria-label="월" required></select>
        <span>월</span>
        <select id="bd-day" aria-label="일" required></select>
        <span>일</span>
      </div>
      <button type="submit">확인</button>
      <button type="button" class="ghost" data-go="welcome">처음으로</button>
      <p id="input-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- 화면 3: 동일 생일자 확인 화면 -->
  <section id="screen-confirm" class="screen screen--center" hidden>
    <div class="panel">
      <h2>혹시 이분이신가요?</h2>
      <ul id="confirm-list" class="pick-list"></ul>
      <button type="button" class="ghost" id="confirm-no">아니에요</button>
    </div>
  </section>

  <!-- [수정] 화면 4: 축하 화면 — 기존 헤더+메시지 폼/목록 삭제, 선물상자 화면으로 교체 -->
  <section id="screen-celebrate" class="screen screen--gift" hidden>
    <!-- 세로 3분할(위/가운데/아래) 구조: 가운데 칸에 선물상자가 항상 정중앙에 온다 -->
    <div class="gift-stage">

      <!-- 위 칸: 축하 문구 -->
      <div class="gift-top">
        <h1 class="gift-title" id="hero-title">생일 축하해요!</h1>
        <p class="gift-date" id="hero-date"></p>
      </div>

      <!-- 가운데 칸: 선물상자 (열면 사라지고 내용 카드가 같은 자리에 나타남) -->
      <div class="gift-center">
        <button type="button" id="gift-box" class="gift" aria-label="선물상자 열기">
          <span class="gift__body"></span>
          <span class="gift__lid"><span class="gift__bow"></span></span>
        </button>

        <!-- 선물을 열면 보이는 내용: 개발자가 설정한 사진 + 메시지 -->
        <div id="gift-content" class="gift-content" hidden>
          <img id="gift-photo" class="gift-photo" alt="생일 선물 사진" hidden />
          <p id="gift-message" class="gift-message"></p>
          <button type="button" class="ghost" data-go="welcome">처음으로</button>
        </div>
      </div>

      <!-- 아래 칸: 안내 문구 -->
      <div class="gift-bottom">
        <p id="gift-hint" class="gift-hint">선물상자를 눌러 열어보세요</p>
      </div>

    </div>
  </section>

  <!-- 화면 5: 개발자 로그인 화면 -->
  <section id="screen-admin-login" class="screen screen--center" hidden>
    <form id="login-form" class="panel">
      <h2>개발자 로그인</h2>
      <label for="admin-id">ID (이메일)</label>
      <input id="admin-id" type="email" autocomplete="username" required />
      <label for="admin-pw">Password</label>
      <input id="admin-pw" type="password" autocomplete="current-password" required />
      <button type="submit">로그인</button>
      <button type="button" class="ghost" data-go="welcome">돌아가기</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- 화면 6: 개발자 화면 -->
  <section id="screen-admin" class="screen" hidden>
    <main class="admin-main">
      <div class="card">
        <h2>생일 등록 / 수정</h2>
        <form id="admin-form">
          <input type="hidden" id="admin-edit-id" />

          <label for="admin-name">이름</label>
          <input id="admin-name" type="text" maxlength="20" required />

          <label>생일</label>
          <div class="row">
            <select id="admin-month" aria-label="월" required></select><span>월</span>
            <select id="admin-day" aria-label="일" required></select><span>일</span>
          </div>

          <!-- [추가] 선물 메시지 -->
          <label for="admin-gift-msg">선물 메시지</label>
          <textarea id="admin-gift-msg" maxlength="500" rows="4" placeholder="선물상자를 열면 보여줄 메시지"></textarea>
          <!-- 수정 모드에서 저장된 메시지가 있을 때만 표시 -->
          <button type="button" class="ghost" id="admin-del-msg" hidden>메시지 삭제</button>

          <!-- [추가] 선물 사진 -->
          <label for="admin-photo">선물 사진</label>
          <input id="admin-photo" type="file" accept="image/*" />
          <div id="admin-photo-box" hidden>
            <img id="admin-photo-preview" class="admin-photo" alt="선물 사진 미리보기" />
            <button type="button" class="ghost" id="admin-del-photo">사진 삭제</button>
          </div>

          <button type="submit" id="admin-save">등록</button>
          <button type="button" class="ghost" id="admin-cancel" hidden>수정 취소</button>
          <p id="admin-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="card">
        <h2>등록된 생일</h2>
        <ul id="admin-list" class="messages"></ul>
      </div>

      <button type="button" class="ghost" id="logout-btn">로그아웃</button>
    </main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
